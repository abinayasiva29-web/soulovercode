<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Over Code — Admin Review</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1A1208;color:#F2E8D5;min-height:100vh;padding:2rem;}
h1{font-size:1.4rem;margin-bottom:1.5rem;}
#gate{max-width:340px;margin:8rem auto;text-align:center;}
#gate input{width:100%;padding:12px;font-size:15px;margin-bottom:10px;border:none;background:#2C1F0E;color:#F2E8D5;}
#gate button{width:100%;padding:12px;background:#8B1A10;color:#F2E8D5;border:none;cursor:pointer;font-size:14px;}
#gateError{color:#e08a7d;font-size:13px;margin-top:10px;min-height:18px;}
#logoutBtn{position:fixed;top:1rem;right:1rem;background:#2C1F0E;color:#F2E8D5;border:1px solid rgba(242,232,213,0.2);padding:8px 14px;font-size:12px;cursor:pointer;}
#app{display:none;max-width:900px;margin:0 auto;}
.card{background:#2C1F0E;border:1px solid rgba(242,232,213,0.15);padding:1.25rem;margin-bottom:1rem;}
.card h3{font-size:1.1rem;margin-bottom:4px;}
.card .meta{font-size:12px;color:rgba(242,232,213,0.55);margin-bottom:10px;}
.card .desc{font-size:14px;line-height:1.5;margin-bottom:10px;}
.card .imperfection{font-size:13px;font-style:italic;color:#C99A52;border-left:2px solid #C99A52;padding-left:10px;margin-bottom:10px;}
.card a{color:#C99A52;}
.card img{max-width:100%;max-height:260px;object-fit:contain;display:block;margin-bottom:10px;background:#111;}
.row{display:flex;gap:10px;}
.row button{flex:1;padding:10px;border:none;cursor:pointer;font-size:13px;letter-spacing:0.5px;}
.approve{background:#4f6b63;color:#fff;}
.reject{background:#8B1A10;color:#fff;}
.empty{opacity:0.5;text-align:center;padding:3rem;}
.status{font-size:12px;margin-top:8px;color:#C99A52;}
.section-divider{margin:2.5rem 0 1.5rem;border-top:1px solid rgba(242,232,213,0.15);padding-top:1.5rem;}
.pform input,.pform textarea{width:100%;padding:10px;margin-bottom:10px;border:none;background:#1A1208;color:#F2E8D5;font-family:inherit;font-size:13px;}
.pform textarea{min-height:80px;}
.pform button{width:100%;padding:12px;background:#8B1A10;color:#F2E8D5;border:none;cursor:pointer;font-size:14px;}
.pform button:disabled{opacity:0.5;}
.precious-row{display:flex;gap:12px;align-items:center;background:#2C1F0E;border:1px solid rgba(242,232,213,0.15);padding:10px;margin-bottom:8px;}
.precious-row img{width:50px;height:50px;object-fit:cover;flex-shrink:0;}
.precious-row .info{flex:1;}
.precious-row .info b{font-size:13px;}
.precious-row .info div{font-size:11px;color:rgba(242,232,213,0.5);}
.precious-row button{background:#8B1A10;color:#fff;border:none;padding:6px 12px;font-size:11px;cursor:pointer;}
</style>
</head>
<body>

<div id="gate">
  <h1>Admin Login</h1>
  <input type="email" id="loginEmail" placeholder="Email" autocomplete="username"/>
  <input type="password" id="loginPw" placeholder="Password" autocomplete="current-password"/>
  <button onclick="doLogin()">Log in</button>
  <div id="gateError"></div>
</div>

<button id="logoutBtn" style="display:none;" onclick="doLogout()">Log out</button>

<div id="app">
  <h1>Pending Submissions — Review &amp; Approve</h1>
  <div id="list"><div class="empty">Loading…</div></div>

  <div class="section-divider">
    <h1>Add a Precious Human Creator</h1>
    <div class="pform">
      <input type="text" id="pName" placeholder="Name*"/>
      <input type="text" id="pHonorific" placeholder="Honorific (e.g. Our Generation's Thiruvalluvar) — optional"/>
      <textarea id="pBio" placeholder="Their story — who they are, why they matter*"></textarea>
      <input type="text" id="pWorks" placeholder="Notable works, comma or dot separated — optional"/>
      <input type="text" id="pQuote" placeholder="A quote about them or from them — optional"/>
      <input type="file" id="pPhoto" accept="image/*"/>
      <button onclick="addPrecious()" id="pAddBtn">Add to the Collection →</button>
    </div>

    <h1 style="margin-top:2rem;">Manage Existing (<span id="pCount">0</span>)</h1>
    <div id="pList"></div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,query,where,onSnapshot,doc,updateDoc,deleteDoc,addDoc,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

import{initializeAppCheck,ReCaptchaV3Provider}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
const app=initializeApp({apiKey:"AIzaSyBaJF1NUzeMdukAEO-Z3MzOkmBpdg26QOs",authDomain:"soulovercode.firebaseapp.com",projectId:"soulovercode",storageBucket:"soulovercode.firebasestorage.app",messagingSenderId:"444742946957",appId:"1:444742946957:web:cd4c309ad2ec00d3fb52c4"});
initializeAppCheck(app,{provider:new ReCaptchaV3Provider('6LcgcnYtAAAAACByp5DFgS8M1TcNGujmyk_uAuQT'),isTokenAutoRefreshEnabled:true});
const db=getFirestore(app);
const auth=getAuth(app);
const storage=getStorage(app);

// Same Maps key as your main site — must have "Geocoding API" enabled too (see instructions).
const MAPS_KEY="AIzaSyDfxD3VcYFZjwYj50fNpQLwZ9ynNLRQ488";

window.doLogin=async function(){
  const email=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPw').value;
  const err=document.getElementById('gateError');
  err.textContent='';
  try{
    await signInWithEmailAndPassword(auth,email,pw);
  }catch(e){
    err.textContent='Login failed — check your email and password.';
  }
};
window.doLogout=function(){signOut(auth);};

onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('logoutBtn').style.display='block';
    startListening();
  }else{
    document.getElementById('gate').style.display='block';
    document.getElementById('app').style.display='none';
    document.getElementById('logoutBtn').style.display='none';
  }
});

async function geocode(city,country){
  const q=encodeURIComponent(city+', '+country);
  const res=await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${q}&key=${MAPS_KEY}`);
  const data=await res.json();
  if(data.status==='OK'&&data.results.length){
    const loc=data.results[0].geometry.location;
    return{lat:loc.lat,lng:loc.lng};
  }
  return null;
}

window.approveEntry=async function(id,city,country,btn){
  btn.textContent='Locating city…';btn.disabled=true;
  try{
    const geo=await geocode(city,country);
    if(!geo){alert('Could not find that city on the map. Check spelling and try again.');btn.textContent='Approve';btn.disabled=false;return;}
    await updateDoc(doc(db,'creators',id),{status:'approved',lat:geo.lat,lng:geo.lng,approvedAt:serverTimestamp()});
  }catch(e){alert('Something went wrong: '+e.message);btn.textContent='Approve';btn.disabled=false;}
};

window.rejectEntry=async function(id){
  if(!confirm('Reject this submission? It will be hidden from the site.'))return;
  await updateDoc(doc(db,'creators',id),{status:'rejected'});
};

function startListening(){
  const q=query(collection(db,'creators'),where('status','==','pending'));
  onSnapshot(q,snap=>{
    const list=document.getElementById('list');
    if(snap.empty){list.innerHTML='<div class="empty">No pending submissions right now.</div>';return;}
    list.innerHTML=snap.docs.map(d=>{
      const c=d.data();
      return `<div class="card">
        ${c.image?`<img src="${c.image}" alt="artwork"/>`:''}
        ${c.voiceNote?`<audio controls style="width:100%;margin-bottom:10px;" src="${c.voiceNote}"></audio>`:''}
        <h3>${c.name||'—'} — ${c.title||c.craft||''}</h3>
        <div class="meta">${c.craft||''}${c.mood?' · '+c.mood:''} · ${c.city||''}, ${c.country||''} ${c.email?'· '+c.email:''}</div>
        <div class="desc">${c.description||''}</div>
        ${c.imperfection?`<div class="imperfection">✦ Not perfect, kept anyway: "${c.imperfection}"</div>`:''}
        ${c.pulse&&c.pulse.length>2?`<div style="margin-bottom:10px;background:rgba(139,26,16,0.1);border:1px solid rgba(139,26,16,0.3);padding:8px;"><div style="font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:#C99A52;margin-bottom:4px;">♥ Human Pulse (${c.pulse.length} keystroke intervals)</div><svg viewBox="0 0 400 32" style="width:100%;height:32px;"><polyline points="${c.pulse.map((iv,i,arr)=>{const w=1-Math.min(iv,700)/700;const y=16-(w*13)*(i%2===0?1:-1)-(w*2);return (i*(400/(arr.length-1||1))).toFixed(1)+','+y.toFixed(1);}).join(' ')}" style="fill:none;stroke:#8B1A10;stroke-width:1.4;"/></svg></div>`:''}
        ${c.link?`<a href="${c.link}" target="_blank">View work link →</a><br><br>`:''}
        <div class="row">
          <button class="approve" onclick="approveEntry('${d.id}','${(c.city||'').replace(/'/g,"\\'")}','${(c.country||'').replace(/'/g,"\\'")}',this)">Approve</button>
          <button class="reject" onclick="rejectEntry('${d.id}')">Reject</button>
        </div>
      </div>`;
    }).join('');
  });
}

window.addPrecious=async function(){
  const name=document.getElementById('pName').value.trim();
  const honorific=document.getElementById('pHonorific').value.trim();
  const bio=document.getElementById('pBio').value.trim();
  const works=document.getElementById('pWorks').value.trim();
  const quote=document.getElementById('pQuote').value.trim();
  const fileInput=document.getElementById('pPhoto');
  const file=fileInput.files[0];
  if(!name||!bio){alert('Name and bio are required.');return;}
  if(!file){alert('Please choose a photo.');return;}
  const btn=document.getElementById('pAddBtn');
  const orig=btn.textContent;
  btn.textContent='Uploading photo...';btn.disabled=true;
  try{
    const fileRef=ref(storage,'precious/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,''));
    await uploadBytes(fileRef,file);
    const photoUrl=await getDownloadURL(fileRef);
    btn.textContent='Saving...';
    await addDoc(collection(db,'precious_creators'),{name,honorific,bio,works,quote,photo:photoUrl,addedAt:serverTimestamp()});
    document.getElementById('pName').value='';
    document.getElementById('pHonorific').value='';
    document.getElementById('pBio').value='';
    document.getElementById('pWorks').value='';
    document.getElementById('pQuote').value='';
    fileInput.value='';
    btn.textContent='Added! ✦';
    setTimeout(()=>{btn.textContent=orig;},1500);
  }catch(e){
    alert('Something went wrong: '+e.message);
    btn.textContent=orig;
  }
  btn.disabled=false;
};

window.deletePrecious=async function(id){
  if(!confirm('Remove this person from the collection? This cannot be undone.'))return;
  await deleteDoc(doc(db,'precious_creators',id));
};

function startListeningPrecious(){
  const q=query(collection(db,'precious_creators'),orderBy('addedAt','desc'));
  onSnapshot(q,snap=>{
    const countEl=document.getElementById('pCount');
    const listEl=document.getElementById('pList');
    if(countEl)countEl.textContent=snap.size;
    if(!listEl)return;
    if(snap.empty){listEl.innerHTML='<div class="empty">None added yet.</div>';return;}
    listEl.innerHTML=snap.docs.map(d=>{
      const p=d.data();
      return `<div class="precious-row">
        <img src="${p.photo}" alt="${p.name}"/>
        <div class="info"><b>${p.name}</b><div>${p.honorific||''}</div></div>
        <button onclick="deletePrecious('${d.id}')">Remove</button>
      </div>`;
    }).join('');
  },err=>console.warn('precious admin list error',err));
}
startListeningPrecious();
</script>
</body>
</html>
